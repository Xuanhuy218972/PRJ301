services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: sportfield-db
    environment:
      POSTGRES_DB: sportfields
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sportfield-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Java Web Application (Tomcat)
  app:
    build: .
    container_name: sportfield-app
    ports:
      - "8080:8080"
    environment:
      # Database connection (connect to db container)
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sportfields
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      # Email Configuration
      SMTP_HOST: sandbox.smtp.mailtrap.io
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ADMIN_EMAIL: admin@sportfieldhub.com
      FROM_NAME: SportFieldHub
      # VNPAY Configuration
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sportfield-network
    restart: unless-stopped

  # Nginx Reverse Proxy (HTTP + HTTPS)
  nginx:
    image: nginx:alpine
    container_name: sportfield-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - sportfield-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  sportfield-network:
    driver: bridge
